[package]
name = "kitesurf-cdp"
description = "A headless browser in pure Rust (Blitz, Stylo, Taffy, Parley, vello_cpu, Boa) serving the Chrome DevTools Protocol."
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "kitesurf-cdp"
path = "src/main.rs"

[dependencies]
anyrender = { version = "0.14", default-features = false }
anyrender_vello_cpu = { version = "0.18", default-features = false }
base64 = "0.22"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "woff", "floats", "autofocus"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
blitz-vibey-script = { path = "../../../src/blitz/packages/blitz-vibey-script" }
boa_engine = { version = "0.22", features = ["annex-b"] }
data-url = "0.3"
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
keyboard-types = "0.8"
linebender_resource_handle = "0.1"
log = "0.4"
parley = { version = "0.12", default-features = false, features = ["std"] }
png = "0.18"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = "0.1.0-pre.0"
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip", "brotli"] }
url = "2"
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "u8_pipeline"] }
