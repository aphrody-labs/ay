# Standalone workspace: Bun's root workspace and lockfile stay untouched. Bun's crates are path dependencies and
# keep inheriting their settings from the root `Cargo.toml`.
[workspace]
resolver = "2"
# bun_js and the crates on it are members: Bun's root workspace does not build Boa.
members = ["cdp", "../../src/bun_js", "../../src/http_rs", "../../src/runtime_js", "../../src/semver_js", "../../src/spawn_rs", "../../src/sqlite_js", "../../src/usockets_rs"]

[package]
name = "bun-boa"
description = "Bun on Boa: Bun's Rust crates with a pure-Rust JavaScript engine, no JavaScriptCore and no C++."
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "bun"
path = "src/main.rs"

[features]
# `bun build`: links Bun's bundler, whose graph still reaches C/C++ (uws, BoringSSL, Highway, lol-html).
build = ["dep:bun_bundler", "dep:bun_event_loop"]
# `bun install`, `bun add`, `bun remove`: Bun's package manager, on Rust uSockets (src/usockets_rs) and the Rust ports
# in src/install. What it reaches of C/C++ that has no Rust yet stops the process (src/install/native.rs).
install = [
  "dep:bun_boringssl_sys",
  "dep:bun_crash_handler",
  "dep:bun_event_loop",
  "dep:bun_http",
  "dep:bun_install",
  "dep:bun_install_types",
  "dep:bun_io",
  "dep:bun_ptr",
  "dep:bun_spawn",
  "dep:bun_spawn_rs",
  "dep:bun_usockets_rs",
  "dep:bun_uws_sys",
  "dep:bun_yarr",
  "dep:getrandom",
  "dep:libc",
  "dep:sha1",
  "dep:sha2",
]

[dependencies]
boa_engine = { path = "../../src/boa/core/engine", features = ["annex-b", "intl_bundled", "experimental"] }
boa_gc = { path = "../../src/boa/core/gc" }
boa_runtime = { path = "../../src/boa/core/runtime" }
bun_ast = { path = "../../src/ast" }
bun_alloc = { path = "../../src/bun_alloc" }
bun_base64 = { path = "../../src/base64" }
bun_boringssl_sys = { path = "../../src/boringssl_sys", optional = true }
bun_bundler = { path = "../../src/bundler", optional = true, features = ["test_support"] }
bun_clap = { path = "../../src/clap" }
bun_event_loop = { path = "../../src/event_loop", optional = true }
bun_http = { path = "../../src/http", optional = true }
bun_install = { path = "../../src/install", optional = true }
bun_install_types = { path = "../../src/install_types", optional = true }
bun_io = { path = "../../src/io", optional = true }
bun_core = { path = "../../src/bun_core" }
bun_crash_handler = { path = "../../src/crash_handler", optional = true }
bun_js = { path = "../../src/bun_js" }
bun_js_parser = { path = "../../src/js_parser" }
bun_js_printer = { path = "../../src/js_printer" }
bun_lint_driver = { path = "../../src/lint/driver" }
bun_parsers = { path = "../../src/parsers" }
bun_runtime_js = { path = "../../src/runtime_js" }
bun_options_types = { path = "../../src/options_types" }
bun_paths = { path = "../../src/paths" }
bun_ptr = { path = "../../src/ptr", optional = true }
bun_spawn = { path = "../../src/spawn", optional = true }
bun_spawn_rs = { path = "../../src/spawn_rs", optional = true }
bun_sys = { path = "../../src/sys" }
bun_usockets_rs = { path = "../../src/usockets_rs", optional = true }
bun_uws_sys = { path = "../../src/uws_sys", optional = true }
bun_sema = { path = "../../src/sema" }
bun_sourcemap = { path = "../../src/sourcemap" }
bun_semver_js = { path = "../../src/semver_js" }
bun_sqlite_js = { path = "../../src/sqlite_js" }
bun_sema_driver = { path = "../../src/sema/driver" }
bun_sema_standalone = { path = "../../src/sema/standalone" }
bun_threading = { path = "../../src/threading" }
bun_yarr = { path = "../../src/yarr", optional = true }
bun_zstd = { path = "../../src/zstd" }
getrandom = { version = "0.4", optional = true }
icu_normalizer = { version = "~2.3.0", features = ["compiled_data", "utf16_iter"] }
libc = { version = "0.2", optional = true }
regress = { version = "0.12", features = ["utf16"] }
serde_json = "1"
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
# Install's URL__* (src/install/wtf.rs), and the `file:` URLs of a Worker's entry point.
url = "2"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
# The HTTPS registry of tests/install.rs.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"

[profile.dev]
debug = "line-tables-only"

# Boa is an interpreter: unoptimised it is too slow to run anything.
[profile.dev.package."*"]
opt-level = 2

# Unoptimized, every operation on a vector is a call that passes it through the stack.
[profile.dev.package.bun_simd]
opt-level = 3
debug-assertions = false
[profile.dev.package.bun_simd_kernels]
opt-level = 3
[profile.dev.package.bun_simdutf_sys]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Crates.io users of Boa and Blitz (Blitz's workspace, kitesurf-cdp) get the in-tree copies in src/boa and src/blitz.
# Rows into vendor/ are written by `bun run vendor`: kitesurf's series in patches/<crate>-<version>/ applied to the
# crates.io tarballs (Stylo, Taffy, Parley, vello_cpu, anyrender, usvg).
[patch.crates-io]
blitz-dom = { path = "../../src/blitz/packages/blitz-dom" }
blitz-html = { path = "../../src/blitz/packages/blitz-html" }
blitz-paint = { path = "../../src/blitz/packages/blitz-paint" }
blitz-traits = { path = "../../src/blitz/packages/blitz-traits" }
boa_engine = { path = "../../src/boa/core/engine" }
boa_gc = { path = "../../src/boa/core/gc" }
boa_runtime = { path = "../../src/boa/core/runtime" }
anyrender = { path = "vendor/anyrender-0.14.0" }
anyrender_svg = { path = "vendor/anyrender_svg-0.15.0" }
anyrender_vello_cpu = { path = "vendor/anyrender_vello_cpu-0.18.0" }
parley = { path = "vendor/parley-0.12.0" }
parley_engine = { path = "vendor/parley_engine-0.12.0" }
regress = { path = "vendor/regress-0.12.0" }
selectors = { path = "vendor/selectors-0.41.0" }
stylo = { path = "vendor/stylo-0.22.0" }
taffy = { path = "vendor/taffy-0.15.0" }
usvg = { path = "vendor/usvg-0.48.1" }
vello_common = { path = "vendor/vello_common-0.3.0" }
vello_cpu = { path = "vendor/vello_cpu-0.3.0" }
