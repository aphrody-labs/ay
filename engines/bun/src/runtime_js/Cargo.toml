[package]
name = "bun_runtime_js"
description = "bun_runtime's JS-visible APIs on bun_js: node:path, node:fs, bun:test's diff, Blob, File, FormData, Bun.file, Bun.write, Bun.Glob, Bun.deepEquals, Bun.spawn, Bun.spawnSync, Bun.which, process.kill, the event loop, timers, fetch, Headers/Request/Response, Bun.serve, node:buffer, TextEncoder and TextDecoder."
version = "0.0.0"
edition = "2024"
publish = false
# A member of the Boa build's workspace, not of Bun's: Bun's root lockfile stays without Boa.
workspace = "../../packages/bun-boa"

[lib]
path = "lib.rs"

# The schemas this crate implements that are not in its directory: the JavaScriptCore build reads them too.
[package.metadata.bun-js]
bindings = [
  "../runtime/api/Glob.bind.ts",
  "../runtime/api/UnsafeObject.bind.ts",
  "../runtime/api/bun/js_bun_spawn_bindings.bind.ts",
  "../runtime/node/Stat.bind.ts",
  "../runtime/node/node_fs_binding.bind.ts",
  "../runtime/node/node_path.bind.ts",
  "../runtime/node/node_validators.bind.ts",
]

[dependencies]
boa_engine = { path = "../boa/core/engine", features = ["annex-b", "intl_bundled", "experimental"] }
boa_gc = { path = "../boa/core/gc" }
boa_wintertc = { path = "../boa/core/wintertc" }
bstr = { version = "1", default-features = false, features = ["alloc"] }
bun_base64 = { path = "../base64" }
bun_core = { path = "../bun_core" }
bun_errno = { path = "../errno" }
bun_glob = { path = "../glob" }
bun_http_rs = { path = "../http_rs" }
bun_deflate = { path = "../deflate" }
bun_http_types = { path = "../http_types" }
bun_io = { path = "../io" }
bun_js = { path = "../bun_js" }
bun_node_path = { path = "../node_path" }
bun_paths = { path = "../paths" }
bun_simdutf_sys = { path = "../simdutf_sys" }
bun_spawn_rs = { path = "../spawn_rs" }
bun_spawn_sys = { path = "../spawn_sys" }
bun_sys = { path = "../sys" }
bun_text_diff = { path = "../text_diff" }
bun_threading = { path = "../threading" }
bun_usockets_rs = { path = "../usockets_rs" }
bun_uws_sys = { path = "../uws_sys" }
bun_watcher = { path = "../watcher" }
bun_which = { path = "../which" }
bun_zstd = { path = "../zstd" }
const_format = "0.2"
encoding_rs = "0.8.35"
getrandom = "0.4"
# crypto/: RustCrypto, instead of BoringSSL.
aes-gcm = "0.10"
blake2 = "0.10"
bun_hash = { path = "../hash" }
bun_wyhash = { path = "../wyhash" }
digest = { version = "0.10", features = ["alloc"] }
hmac = "0.12"
md-5 = "0.10"
md4 = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
ripemd = "0.1"
scrypt = { version = "0.11", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
libc = "0.2"
# The descriptors of a child (its pidfd and pipes) on bun_http_rs's reactor.
mio = { version = "1", features = ["os-poll", "os-ext"] }

[dev-dependencies]
# The C and C++ symbols that bun_core and bun_sys link against (WTF), in Rust, as the bun binary has them.
bun_sema_standalone = { path = "../sema/standalone" }
# AbortController and AbortSignal, which the realms of bun-boa have from it.
boa_runtime = { path = "../boa/core/runtime" }
