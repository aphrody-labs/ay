[package]
name = "bun_spawn_rs"
description = "The C ABI of spawning that bun_spawn_sys and bun_spawn link against, in Rust for the Boa build: posix_spawn_bun (bun-spawn.cpp) and the signal forwarding of spawnSync (c-bindings.cpp)."
version = "0.0.0"
edition = "2024"
publish = false
# A member of the Boa build's workspace, not of Bun's: the JavaScriptCore build has these symbols in C++.
workspace = "../../packages/bun-boa"

[lib]
path = "lib.rs"

[dependencies]
bun_core = { path = "../bun_core" }
libc = "0.2"
