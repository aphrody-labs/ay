[package]
name = "bun_sqlite_js"
description = "bun:sqlite on bun_js, over Turso (turso_core): the native side of src/js/bun/sqlite.ts without SQLite's C."
version = "0.0.0"
edition = "2024"
publish = false
# A member of the Boa build's workspace, not of Bun's: Bun's root lockfile stays without Turso.
workspace = "../../packages/bun-boa"

[lib]
path = "lib.rs"

[dependencies]
# turso_core's, without its `std` feature: then it calls `core::intrinsics::abort`, which nightly no longer has.
branches = { version = "0.4.6", features = ["std"] }
boa_gc = { path = "../boa/core/gc" }
bun_core = { path = "../bun_core" }
bun_js = { path = "../bun_js" }
bun_paths = { path = "../paths" }
bun_sys = { path = "../sys" }
# No C: not `simd` (simsimd), `fts` (tantivy) or `stacker` (psm), and AEGIS in Rust (`pure-rust-crypto`).
turso_core = { version = "=0.9.0-pre.6", default-features = false, features = [
  "fs",
  "json",
  "time",
  "uuid",
  "series",
  "percentile",
  "pure-rust-crypto",
] }
turso_ext = { version = "=0.9.0-pre.6", features = ["core_only"] }
turso_parser = "=0.9.0-pre.6"
turso_sqlite = "=0.9.0-pre.6"

[dev-dependencies]
# The symbols that bun_core and bun_sys import from the rest of Bun, as the `bun` binary of bun-boa links them.
bun_sema_standalone = { path = "../sema/standalone" }
