[package]
name = "bun_js"
description = "The engine boundary Bun's Rust code calls instead of bun_jsc: values, objects, classes, modules, GC roots and exceptions, on Boa."
version = "0.0.0"
edition = "2024"
publish = false
# A member of the Boa build's workspace, not of Bun's: Bun's root lockfile stays without Boa.
workspace = "../../packages/bun-boa"

[lib]
path = "lib.rs"

[dependencies]
boa_engine = { path = "../boa/core/engine", features = ["annex-b", "intl_bundled", "experimental"] }
boa_gc = { path = "../boa/core/gc" }
bun_alloc = { path = "../bun_alloc" }
bun_core = { path = "../bun_core" }
