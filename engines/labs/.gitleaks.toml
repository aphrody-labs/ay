# gitleaks: the default rules, minus the fake credentials that redaction and auth tests feed themselves.
[extend]
useDefault = true

[[allowlists]]
description = "test fixtures and redaction tests (fake keys by design)"
paths = [
  '''(^|/)tests?/''',
  '''(^|/)test_[^/]*\.py$''',
  '''\.test\.[cm]?[jt]sx?$''',
  '''(^|/)fixtures/''',
  '''^skills/request-progress/scripts/request-groups\.mjs$''',
  '''^packages/mem/src/utils/redaction\.ts$''', # the patterns it redacts
]
