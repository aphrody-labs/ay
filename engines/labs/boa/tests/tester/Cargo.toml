[package]
name = "boa_tester"
description = "ECMA-262 tests runner for the Boa JavaScript engine."
keywords = ["javascript", "ECMAScript", "compiler", "test262", "tester"]
categories = ["command-line-utilites"]
publish = false
version = "0.22.0"
edition = "2024"
authors = ["boa-dev"]
license = "Unlicense OR MIT"
repository = "https://github.com/boa-dev/boa"
rust-version = "1.100.0"

[dependencies]
boa_engine = { workspace = true, features = ["float16"] }
boa_runtime = { workspace = true, features = ["test262"] }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true # TODO: Track https://github.com/saphyr-rs/saphyr.
serde_json.workspace = true
bitflags.workspace = true
colored.workspace = true
rustc-hash = { workspace = true, features = ["std"] }
rayon.workspace = true
toml.workspace = true
color-eyre.workspace = true
phf = { workspace = true, features = ["macros"] }
comfy-table.workspace = true
serde_repr.workspace = true
cow-utils.workspace = true

[features]
annex-b = ["boa_engine/annex-b", "boa_runtime/annex-b"]
default = ["boa_engine/intl_bundled", "boa_engine/experimental", "annex-b"]

[lints.rust]
warnings = "warn"
missing_docs = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.rust.future_incompatible]
level = "warn"
priority = -1

[lints.rust.let_underscore]
level = "warn"
priority = -1

[lints.rust.nonstandard_style]
level = "warn"
priority = -1

[lints.rust.rust_2018_compatibility]
level = "warn"
priority = -1

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[lints.rust.rust_2021_compatibility]
level = "warn"
priority = -1

[lints.rust.unused]
level = "warn"
priority = -1

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.correctness]
level = "warn"
priority = -1

[lints.clippy.suspicious]
level = "warn"
priority = -1

[lints.clippy.style]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.perf]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[package.metadata.docs.rs]
all-features = true
