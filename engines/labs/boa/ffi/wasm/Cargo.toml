[package]
name = "boa_wasm"
description = "Wasm compatibility layer for the Boa JavaScript engine."
keywords = ["javascript", "compiler", "lexer", "parser", "js"]
categories = ["parser-implementations", "wasm", "compilers"]
publish = false
version = "0.22.0"
edition = "2024"
authors = ["boa-dev"]
license = "Unlicense OR MIT"
repository = "https://github.com/boa-dev/boa"
rust-version = "1.100.0"

[dependencies]
boa_engine = { workspace = true, features = ["js"] }
wasm-bindgen = { workspace = true, default-features = false }
console_error_panic_hook.workspace = true

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true

[features]
default = [
    "boa_engine/annex-b",
    "boa_engine/experimental",
    "boa_engine/float16",
    "boa_engine/intl_bundled",
    "boa_engine/temporal",
    "boa_engine/xsum",
]

[lib]
crate-type = ["cdylib", "lib"]
name = "boa_wasm"
bench = false

[lints.rust]
warnings = "warn"
missing_docs = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.rust.future_incompatible]
level = "warn"
priority = -1

[lints.rust.let_underscore]
level = "warn"
priority = -1

[lints.rust.nonstandard_style]
level = "warn"
priority = -1

[lints.rust.rust_2018_compatibility]
level = "warn"
priority = -1

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[lints.rust.rust_2021_compatibility]
level = "warn"
priority = -1

[lints.rust.unused]
level = "warn"
priority = -1

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.correctness]
level = "warn"
priority = -1

[lints.clippy.suspicious]
level = "warn"
priority = -1

[lints.clippy.style]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.perf]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[package.metadata.docs.rs]
all-features = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
