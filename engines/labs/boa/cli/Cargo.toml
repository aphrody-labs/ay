[package]
name = "boa_cli"
keywords = ["javascript", "compiler", "js", "cli"]
categories = ["command-line-utilities"]
default-run = "boa"
description = "Boa is a Javascript lexer, parser and compiler written in Rust. Currently, it has support for some of the language."
version = "0.22.0"
edition = "2024"
authors = ["boa-dev"]
license = "Unlicense OR MIT"
repository = "https://github.com/boa-dev/boa"
rust-version = "1.100.0"

[dependencies]
boa_engine = { workspace = true, features = [
    "deser",
    "float16",
    "flowgraph",
    "temporal",
    "trace",
    "xsum",
] }
boa_parser.workspace = true
boa_gc.workspace = true
boa_runtime = { workspace = true, features = ["test262"] }
rustyline = { workspace = true, features = ["derive", "with-file-history"] }
clap = { workspace = true, features = ["derive"] }
serde_json.workspace = true
colored.workspace = true
regex.workspace = true
phf = { workspace = true, features = ["macros"] }
dhat = { workspace = true, optional = true }
color-eyre.workspace = true
cow-utils.workspace = true
futures-concurrency.workspace = true
smol.workspace = true
unsend = { workspace = true, features = ["alloc"] }
async-channel.workspace = true
rustls.workspace = true

[features]
default = [
    "boa_engine/annex-b",
    "boa_runtime/annex-b",
    "boa_engine/experimental",
    "boa_engine/intl_bundled",
    "boa_engine/native-backtrace",
    "fast-allocator",
    "fetch",
]
dhat = ["dep:dhat"]
fast-allocator = ["dep:mimalloc-safe", "dep:tikv-jemallocator"]
fetch = ["boa_runtime/fetch", "boa_runtime/reqwest-blocking"]

[target.x86_64-unknown-linux-gnu.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
mimalloc-safe = { workspace = true, optional = true, features = [
    "skip_collect_on_exit",
] }

[[bin]]
name = "boa"
doc = false
path = "src/main.rs"

[lints.rust]
warnings = "warn"
missing_docs = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.rust.future_incompatible]
level = "warn"
priority = -1

[lints.rust.let_underscore]
level = "warn"
priority = -1

[lints.rust.nonstandard_style]
level = "warn"
priority = -1

[lints.rust.rust_2018_compatibility]
level = "warn"
priority = -1

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[lints.rust.rust_2021_compatibility]
level = "warn"
priority = -1

[lints.rust.unused]
level = "warn"
priority = -1

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.correctness]
level = "warn"
priority = -1

[lints.clippy.suspicious]
level = "warn"
priority = -1

[lints.clippy.style]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.perf]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[package.metadata.docs.rs]
all-features = true
