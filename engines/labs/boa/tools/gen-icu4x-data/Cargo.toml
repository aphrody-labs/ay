[package]
name = "gen-icu4x-data"
publish = false
edition = "2024"
version = "0.22.0"
rust-version = "1.100.0"
authors = ["boa-dev"]
repository = "https://github.com/boa-dev/boa"
license = "Unlicense OR MIT"
description = "Boa is a Javascript lexer, parser and compiler written in Rust. Currently, it has support for some of the language."

[dependencies]
icu_provider_export = { workspace = true, features = [
    "blob_exporter",
    "rayon",
] }
icu_provider_source = { workspace = true, features = [
    "networking",
    "use_wasm",
    "unstable"
] }
log.workspace = true
simple_logger.workspace = true

# Components

icu_casemap = { workspace = true, features = ["datagen"] }
icu_collator = { workspace = true, features = ["datagen"] }
icu_datetime = { workspace = true, features = ["datagen", "unstable"] }
icu_time = { workspace = true, features = ["datagen"] }
icu_decimal = { workspace = true, features = ["datagen", "unstable"] }
icu_list = { workspace = true, features = ["datagen"] }
icu_locale = { workspace = true, features = ["datagen"] }
icu_normalizer = { workspace = true, features = ["datagen"] }
icu_plurals = { workspace = true, features = ["datagen", "unstable"] }
icu_segmenter = { workspace = true, features = ["datagen"] }
icu_locale_fallback = { workspace = true, features = ["datagen"] }
icu_calendar = { workspace = true, features = ["datagen"] }

[lints.rust]
warnings = "warn"
missing_docs = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.rust.future_incompatible]
level = "warn"
priority = -1

[lints.rust.let_underscore]
level = "warn"
priority = -1

[lints.rust.nonstandard_style]
level = "warn"
priority = -1

[lints.rust.rust_2018_compatibility]
level = "warn"
priority = -1

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[lints.rust.rust_2021_compatibility]
level = "warn"
priority = -1

[lints.rust.unused]
level = "warn"
priority = -1

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.correctness]
level = "warn"
priority = -1

[lints.clippy.suspicious]
level = "warn"
priority = -1

[lints.clippy.style]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.perf]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[package.metadata.docs.rs]
all-features = true
