[package]
name = "boa_runtime"
description = "Example runtime for the Boa JavaScript engine."
keywords = ["javascript", "js", "runtime"]
categories = ["command-line-utilities"]
version = "0.22.0"
edition = "2024"
authors = ["boa-dev"]
license = "Unlicense OR MIT"
repository = "https://github.com/boa-dev/boa"
rust-version = "1.100.0"

[dependencies]
boa_engine.workspace = true
boa_gc.workspace = true
boa_wintertc.workspace = true
bus = { workspace = true, optional = true }
bytemuck.workspace = true
either = { workspace = true, optional = true }
futures.workspace = true
futures-lite.workspace = true
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustc-hash = { workspace = true, features = ["std"] }
serde_json = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
indoc.workspace = true
rstest.workspace = true
test-case.workspace = true
textwrap.workspace = true
temp-env.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# Default should not add `reqwest` as it is not available on all platforms.
default = [
    "boa_engine/float16",
    "boa_engine/temporal",
    "boa_engine/xsum",
    "fetch",
    "url",
]

all = ["default", "reqwest-blocking"]
url = ["dep:url"]
fetch = [
    "dep:url",
    "dep:either",
    "dep:http",
    "dep:serde_json",
    "boa_engine/either",
]
reqwest-blocking = ["dep:reqwest", "reqwest/blocking"]
process = []
annex-b = ["boa_engine/annex-b"]
test262 = ["dep:bus"]

[lints.rust]
warnings = "warn"
missing_docs = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_compatibility = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
incompatible_msrv = "allow"
cargo_common_metadata = "allow"
