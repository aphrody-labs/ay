[package]
name = "anyrender_tiny_skia"
description = "tiny-skia backend for anyrender"
version = "0.1.1"
documentation = "https://docs.rs/anyrender_tiny_skia"
repository = "https://github.com/dioxuslabs/anyrender"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
anyrender = { workspace = true }
image_filters_types = { workspace = true }

debug_timer = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
tiny-skia = "0.12"
bytemuck = "1"
rgb = "0.8"
skrifa = { version = "0.49", default-features = false, features = ["std"] }

# WindowRenderer backends

[features]
pixels_window_renderer = []
softbuffer_window_renderer = []
log_frame_times = [
  "debug_timer/enable",
]

[package.metadata.docs.rs]
features = ["pixels_window_renderer", "softbuffer_window_renderer"]

[lints.clippy]
incompatible_msrv = "allow"
cargo_common_metadata = "allow"
