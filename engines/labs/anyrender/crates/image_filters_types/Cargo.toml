[package]
name = "image_filters_types"
description = "Types describing SVG/CSS image filter graphs"
version = "0.1.0"
documentation = "https://docs.rs/image_filters_types"
repository = "https://github.com/dioxuslabs/anyrender"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
default = []
serde = ["dep:serde", "kurbo/serde", "peniko/serde", "smallvec/serde"]

[dependencies]
kurbo = { workspace = true }
peniko = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
smallvec = "1.16.6"

[lints.clippy]
incompatible_msrv = "allow"
cargo_common_metadata = "allow"
