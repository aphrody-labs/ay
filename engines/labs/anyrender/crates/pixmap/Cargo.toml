[package]
name = "pixmap"
description = "A minimal owned pixel buffer shared by AnyRender's glyph and atlas crates"
version = "0.1.0"
documentation = "https://docs.rs/pixmap"
repository = "https://github.com/dioxuslabs/anyrender"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
default = []
blend = []
resample = []
transform = []
png = ["dep:png"]

[dependencies]
png = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
incompatible_msrv = "allow"
cargo_common_metadata = "allow"
