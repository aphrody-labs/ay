[package]
name = "anyrender"
description = "2D Canvas abstraction"
version = "0.15.1"
documentation = "https://docs.rs/anyrender"
repository = "https://github.com/dioxuslabs/anyrender"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
default = []
serde = [
  "dep:serde",
  "kurbo/serde",
  "peniko/serde",
  "image_filters_types/serde",
]

[dependencies]
image_filters_types = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
raw-window-handle = { workspace = true }

# Serde
serde = { workspace = true, features = ["derive", "rc"], optional = true }
smallvec = "1.16.6"

[lints.clippy]
incompatible_msrv = "allow"
cargo_common_metadata = "allow"
