[package]
autoexamples = false
name = "ratatui-image"
version = "8.1.1"
edition = "2024"
authors = ["Benjamin Große <ste3ls@gmail.com>"]
description = "An image widget for ratatui, supporting sixels, kitty, iterm2, and unicode-halfblocks"
keywords = ["ratatui", "image", "sixel", "kitty", "iterm2"]
repository = "https://github.com/benjajaja/ratatui-image"
readme = "README.md"
license = "MIT"
exclude = ["assets/*"]
rust-version = "1.86.0"

[features]
# No image-defaults (image/default): it puts every codec, rav1e's AVIF encoder among them, in the lockfile, and
# kitesurf decodes with its own image features.
default = ["crossterm", "query"]
crossterm = ["ratatui/crossterm"]
# The terminal-capability query (font size, protocol detection): rustix on unix, windows on Windows. Off for wasm,
# where rustix's errno does not build.
query = ["dep:rustix", "dep:windows"]
termion = ["ratatui/termion"]
termwiz = ["ratatui/termwiz"]
serde = ["dep:serde"]
tokio = ["dep:tokio"]
chafa = ["dep:libloading"]

[dependencies]
image = { version = "^0.25.10", default-features = false, features = ["jpeg"] }
icy_sixel = { version = "^0.1.3" }
libloading = { version = "0.8", optional = true }
serde = { version = "^1.0", optional = true, features = ["derive"] }
base64-simd = { version = "0.8" }
rand = { version = "^0.9.5" }
ratatui = { version = "^0.30.2", default-features = false, features = [] }
thiserror = { version = "2.0.21" }
tokio = { version = "1.54.1", default-features = false, optional = true, features = ["sync"]}

[target.'cfg(not(windows))'.dependencies]
rustix = { version = "^1.1.6", optional = true, features = ["stdio", "termios", "fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, default-features = false, features = [
  "std",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_Security",
] }

[[bin]]
name = "ratatui-image"
path = "./src/bin/ratatui-image/main.rs" # cargo readme needs this for some reason
required-features = ["crossterm"]

[dev-dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
insta = "1.49.0"

[package.metadata.docs.rs]
features = ["crossterm"]

[lints.clippy]
incompatible_msrv = "allow"
cargo_common_metadata = "allow"
