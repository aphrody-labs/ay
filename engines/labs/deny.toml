# cargo-deny: R&D, so licenses are not gated. Native code (C, C++, asm) stays where it is faster or has no Rust
# equivalent; the bans below are the ones with a measured Rust replacement.
[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  { crate = "skia-bindings", reason = "C++; vello_cpu renders" },
  { crate = "openssl-sys", reason = "rustls" },
  { crate = "harfbuzz-sys", reason = "C++; skrifa/harfrust" },
  { crate = "harfbuzz-subset-sys", reason = "C++; a Rust subsetter" },
  { crate = "fontconfig-sys", reason = "fontique without fontconfig" },
  { crate = "jemalloc-sys", reason = "one allocator: Bun's" },
  { crate = "tikv-jemalloc-sys", reason = "one allocator: Bun's" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
