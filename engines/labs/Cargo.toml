# Build-time first: dev builds keep only line tables and optimize dependencies once (they are cached), release is
# the size/speed build Bun ships. Measured by `bun run bench:build` (build/bench.json).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

[profile.size]
inherits = "release"
opt-level = "z"
panic = "abort"
