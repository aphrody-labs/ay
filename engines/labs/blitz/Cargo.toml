[package]
name = "blitz-examples"
version = "0.0.1"
authors = ["Jonathan Kelley"]
edition = "2024"
description = "Top level crate for Blitz"
license = "MIT OR Apache-2.0"
keywords = ["dom", "ui", "gui", "react", "wasm"]
rust-version = "1.91.0"
publish = false

[features]
log-times = ["log-frame-times", "log-phase-times"]
log-frame-times = ["dioxus-native/log-frame-times"]
log-phase-times = ["dioxus-native/log-phase-times"]

[dev-dependencies]
anyrender = { workspace = true }
anyrender_vello = { workspace = true }
anyrender_vello_cpu = { workspace = true, features = ["multithreading"] }
anyrender_vello_gpu = { workspace = true }
blitz-dom = { workspace = true, features = ["default"] }
blitz-html = { workspace = true }
blitz-traits = { workspace = true }
blitz-paint = { workspace = true }
blitz-shell = { workspace = true }
blitz-net = { workspace = true }
blitz-vibey-script = { workspace = true }
blitz = { workspace = true, features = ["net"] }
dioxus = { workspace = true }
dioxus-native = { workspace = true, features = [
    "vello-gpu",
    "floats",
    "svg",
    "prelude",
    "data-uri",
    "net",
    "html",
] }
euclid = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
image = { workspace = true }
png = { workspace = true }
rand = "0.9"
peniko = { workspace = true }
color = { workspace = true }
env_logger = "0.11"
tracing-subscriber = "0.3"
vello = "0.12"
vello_cpu = "0.4"
vello_gpu = "0.4"
wgpu = { workspace = true }
wgpu_context = { workspace = true }

