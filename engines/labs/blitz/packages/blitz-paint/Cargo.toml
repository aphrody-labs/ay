[package]
name = "blitz-paint"
description = "Paint a Blitz Document using anyrender"
documentation = "https://docs.rs/blitz-paint"
version = "0.3.0-beta.5"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "blitz-dom/svg"]
custom-widget = ["blitz-dom/custom-widget"]
font-embolden = []
apple-font-embolden = []
# Paint overlay scrollbar thumbs on scroll containers, and enable their
# drag/hover interaction in blitz-dom (off by default while the feature
# matures).
scrollbars = ["blitz-dom/scrollbars"]

[dependencies]
# Blitz dependencies
anyrender = { workspace = true }
anyrender_svg = { workspace = true, optional = true }
blitz-traits = { workspace = true }
blitz-dom = { workspace = true }

# Servo dependencies
style = { workspace = true }

# DioxusLabs dependencies
taffy = { workspace = true }

# Linebender + WGPU dependencies
parley = { workspace = true, features = ["bytemuck"] }
skrifa = { version = "0.49", default-features = false, features = ["std"] }
color = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }

# Other dependencies
bytemuck = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true, optional = true }

[lints.clippy]
incompatible_msrv = "allow"
cargo_common_metadata = "allow"
