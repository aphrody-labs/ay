# The trees vendored into this monorepo with `git subtree` (full history), and how they join the one Cargo workspace.
# `bun run sync` adds or pulls each tree, then `bun run unify` regenerates the root Cargo.toml from them.
# members: upstream members (globs) minus `purge`; `purge` matches path segments (examples, benches, …).

# Dev-dependencies that only serve purged targets (benches: criterion, boa's jemalloc; ratatui-image's examples:
# color-eyre), cut from every member.
cut = ["criterion", "tikv-jemallocator", "color-eyre"]
purge = ["examples", "example", "benches", "bench", "fuzz", "tests", "test", "tools", "apps", "cli", "wpt", "ffi", "xtask", "sites", "docs"]

# Exact versions in Cargo.lock, applied by `bun run unify`.
[lock]
# 1.1.10 moved to miniz_oxide 0.9; png 0.18.1 still names 0.8 (unused since 0.17.12, dropped on png main).
flate2 = "1.1.9"

# Lint levels unify writes into every member's [lints], over the member's own; a tree's `lints` go on top.
[lints.clippy]
# One pinned nightly (rust-toolchain.toml) builds every member: a member's rust-version is its upstream's claim.
incompatible_msrv = "allow"
# clippy::cargo (parley) reads every workspace member's metadata: here that is other trees' unpublished crates.
cargo_common_metadata = "allow"

[trees.boa]
remote = "https://github.com/aphrody-dev/boa"
branch = "main"
upstream = "https://github.com/boa-dev/boa"

[trees.blitz]
# Headless: Bun renders without a window, so the winit/wayland shell stack stays out.
drop = ["packages/blitz-shell", "packages/blitz", "packages/dioxus-native", "packages/dioxus-native-dom", "packages/accesskit_xplat", "packages/blitz-vibey-cdp-server", "packages/blitz-test-harness", "packages/parley_code_editor"]
remote = "https://github.com/aphrody-dev/blitz"
branch = "main"
upstream = "https://github.com/DioxusLabs/blitz"

[trees.stylo]
# The release blitz builds against, carrying kitesurf's stylo and selectors series. Move with blitz.
remote = "https://github.com/servo/stylo"
branch = "v0.24.0"

[trees.stylo.lints.clippy]
# Upstream runs no clippy (770 style findings, plus its generated properties.rs); correctness still denies.
all = { level = "allow", priority = -1 }
correctness = "deny"

[trees.ratatui-image]
# kitesurf's terminal renderer; its series feature-gates the terminal query (rustix) so the crate builds for wasm.
remote = "https://github.com/benjajaja/ratatui-image"
branch = "v8.1.1"

[trees.kitesurf]
# Its vendor patch series (scripts/patches/) are ported onto the in-tree crates (`bun run port`), so it builds
# against blitz main / stylo 0.24. Its usvg and jpeg-encoder series have no in-tree crate: those build
# from crates.io unpatched (usvg moves to blitz's 0.50).
remote = "https://github.com/cloudflare/kitesurf"
# Held at the commit whose series are all ported. main (f2421d86d5, 2026-11-26) adds blitz-dom 0104-0115,
# boa_engine 0027-0028 and stylo 0022, which its core needs (style_text_epoch, demand_font_faces) and which conflict
# with blitz main's mutator/stylo split: port those (`bun run port kitesurf`, `git am -3`), then move to main.
branch = "0affe70c9202b80396e3c5bf147018cb760af633"
drop = ["packages/scene-host-wasm"]

[trees.rubash]
remote = "https://github.com/unixwin/rubash"
branch = "master"

[trees.rubash.lints.clippy]
# Upstream runs no clippy (1.3k style findings are its own to fix); correctness still denies.
all = { level = "allow", priority = -1 }
correctness = "deny"

[trees.parley]
remote = "https://github.com/linebender/parley"
# The release blitz builds against; main dropped InlineBoxKind. Move with blitz.
branch = "v0.13.0"

[trees.vello]
remote = "https://github.com/linebender/vello"
branch = "main"
# vello_cpu and its common crate are what Bun renders with; the GPU crates stay out.
keep = ["vello_cpu", "vello_common", "glifo"]

[trees.taffy]
remote = "https://github.com/DioxusLabs/taffy"
branch = "main"
# The library and the helper crate its tests use: its scripts/ are test generators (chrome, fixtures).
keep = [".", "tests/common"]

[trees.taffy.lints.clippy]
# Its tests wrap each file in a module of the file's name; upstream lints without --all-targets.
module_inception = "allow"

[trees.anyrender]
remote = "https://github.com/DioxusLabs/anyrender"
branch = "main"
# Headless and CPU-only like blitz and vello: no window renderers, no wgpu, no skia.
drop = ["crates/softbuffer_window_renderer", "crates/pixels_window_renderer", "crates/wgpu_context", "crates/anyrender_skia", "crates/anyrender_vello", "crates/anyrender_vello_gpu", "crates/anyrender_vello_hybrid", "crates/wasm_skia_example"]
