[package]
autoexamples = false
name = "glifo"
version = "0.5.0"
description = "Glifo provides APIs for efficiently rendering text."
keywords = ["text", "layout"]
categories = ["gui", "graphics"]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["foldhash/std", "vello_common/std", "skrifa/std"]
libm = ["skrifa/libm", "vello_common/libm", "dep:core_maths"]
png = ["std", "dep:png", "vello_common/png"]

[dependencies]
bytemuck = { workspace = true }
foldhash = { workspace = true }
# TODO: Consider just using libm via kurbo, but it doesn't seem to have a `fract` method.
core_maths = { workspace = true, optional = true }
hashbrown = { workspace = true, features = ["raw-entry"] }
log = { workspace = true }
peniko = { workspace = true }
skrifa = { version = "0.49.0", default-features = false, features = ["autohint_shaping"] }
smallvec = { workspace = true }
vello_common = { workspace = true }
png = { workspace = true, optional = true }

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(disable_dispatch_sse4_2)", "cfg(disable_dispatch_avx2)", "cfg(disable_dispatch_avx512)"] }

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "allow"
negative_feature_names = "warn"
redundant_feature_names = "allow"
wildcard_dependencies = "warn"
incompatible_msrv = "allow"
