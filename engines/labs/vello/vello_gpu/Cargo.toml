[package]
name = "vello_gpu"
version = "0.4.0"
description = "A GPU renderer for Vello with CPU-side preprocessing."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["wasm32-unknown-unknown"]

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
vello_common = { workspace = true, features = ["std"] }
glifo = { workspace = true, default-features = false, optional = true }
wgpu = { workspace = true, default-features = false, optional = true }
vello_gpu_shaders = { workspace = true, optional = true }
log = { workspace = true }
hashbrown = { workspace = true }

js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlContextAttributes",
    "WebGlProgram",
    "WebGlUniformLocation",
    "WebGlBuffer",
    "WebGlShader",
    "WebGlSync",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "WebGlSampler",
    "WebGlVertexArrayObject",
], optional = true }

[dev-dependencies]
png = { workspace = true }
pollster = { workspace = true }
vello_common = { workspace = true, features = ["pico_svg"] }
roxmltree = "0.20.0"

[features]
default = ["wgpu", "wgpu_default", "text", "all_shader_features"]
# Enable all optional shader features.
all_shader_features = [
    "blurred_rounded_rect",
    "full_image_support",
    "gradient_sweep",
    "wgpu_external_texture",
]
blurred_rounded_rect = ["vello_gpu_shaders?/blurred_rounded_rect"]
full_image_support = ["vello_gpu_shaders?/full_image_support"]
gradient_sweep = ["vello_gpu_shaders?/gradient_sweep"]
wgpu_external_texture = ["vello_gpu_shaders?/wgpu_external_texture"]
std = ["vello_common/std", "glifo?/std"]
libm = ["vello_common/libm", "glifo?/libm"]
wgpu = ["dep:wgpu", "dep:vello_gpu_shaders"]
# Enable wgpu with its default features. If you need to customise the set of enabled wgpu features,
# please disable this crate's default features, enable its "wgpu" feature, then depend on wgpu directly
# with the features which you need enabled.
wgpu_default = ["wgpu", "wgpu/default"]
# Add support for text rendering.
text = ["dep:glifo", "glifo/std"]
probe = ["vello_common/probe"]
webgl = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:vello_gpu_shaders",
    "vello_gpu_shaders/glsl",
]

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(disable_dispatch_sse4_2)", "cfg(disable_dispatch_avx2)", "cfg(disable_dispatch_avx512)"]

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "allow"
wildcard_dependencies = "warn"

[[example]]
name = "render_to_file"
required-features = ["wgpu"]
