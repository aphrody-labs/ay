[package]
name = "vello_gpu_wgpu_video"
description = "Vello GPU example that renders decoded NV12 video frames bound as `wgpu::ExternalTexture`s. macOS-only: zero-copy AVFoundation / VideoToolbox -> wgpu plane import."
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"
publish = false

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(disable_dispatch_sse4_2)", "cfg(disable_dispatch_avx2)", "cfg(disable_dispatch_avx512)"]

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "allow"
wildcard_dependencies = "warn"

[dependencies]
winit = { version = "0.30.13" }
wgpu = { workspace = true, default-features = true }
vello_common = { workspace = true, features = ["std"] }
vello_gpu = { workspace = true, features = [
    "full_image_support",
    "text",
    "wgpu",
    "wgpu_default",
    "wgpu_external_texture",
] }
glifo = { workspace = true }
skrifa = { version = "0.49.0", default-features = false, features = ["autohint_shaping"] }
image = { workspace = true, features = ["jpeg"] }
pollster = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
env_logger = "0.11.9"

# Apple-only — used by the video pipeline (AVAssetReader demuxer, VideoToolbox decoder,
# CVMetalTextureCache zero-copy import of NV12 plane textures into wgpu).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = [
    "AVAsset",
    "AVAssetTrack",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVMediaFormat",
    # Enables `AVAssetReaderOutput::copyNextSampleBuffer` (returns CMSampleBuffer).
    "objc2-core-media",
] }
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = { version = "0.3.2", features = [
    "NSString",
    "NSURL",
    "NSError",
    "NSArray",
    "NSGeometry",
] }
objc2-metal = { version = "0.3.2", features = [
    "MTLDevice",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLResource",
] }
objc2-video-toolbox = "0.3.2"
