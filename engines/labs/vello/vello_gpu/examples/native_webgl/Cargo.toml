[package]
name = "native_webgl"
version = "0.12.0"
description = "An example showing Vello GPU using the WebGL2 renderer backend."
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(disable_dispatch_sse4_2)", "cfg(disable_dispatch_avx2)", "cfg(disable_dispatch_avx512)"]

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "allow"
wildcard_dependencies = "warn"

[dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
js-sys = { workspace = true }
log = { workspace = true }
vello_common = { workspace = true, features = ["probe"] }
vello_gpu = { workspace = true, default-features = false, features = [
    "probe",
    "text",
    "webgl",
    "all_shader_features",
] }
vello_example_scenes = { workspace = true, features = ["webgl_gpu_timing"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "AddEventListenerOptions",
    "Window",
    "Location",
    "History",
    "UrlSearchParams",
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "WebGl2RenderingContext",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
] }

[build-dependencies]
# The shader features must match those enabled for `vello_gpu`, or the shaders compiled by the
# generated JavaScript are rejected and recompiled.
vello_gpu_shaders = { workspace = true, features = [
    "glsl",
    "blurred_rounded_rect",
    "full_image_support",
    "gradient_sweep",
] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
