[package]
name = "vello_common"
# When updating, also update the version in the workspace dependency in the root Cargo.toml
version = "0.4.0"
description = "Core data structures and utilities shared across the Vello rendering, including geometry processing and tiling logic."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"

[package.metadata.docs.rs]
all-features = true
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]
bytemuck = { workspace = true, features = ["derive", "extern_crate_alloc"] }
peniko = { workspace = true, features = ["bytemuck"] }
fearless_simd = { workspace = true }
fearless_simd_macros = { workspace = true }
png = { workspace = true, optional = true }
roxmltree = { version = "0.21.2", optional = true }
smallvec = { workspace = true }
thiserror = { workspace = true, default-features = false }
etagere = { workspace = true }
guillotiere = { workspace = true }
libm = { version = "0.2.16", optional = true }
log = { workspace = true }

[features]
# If adding new features, also document in `src/lib.rs`
default = ["std", "png"]
# Get floating point functions from the standard library (likely using your target's libc).
std = ["peniko/std", "fearless_simd/std"]
# Use floating point implementations from libm.
libm = ["peniko/libm", "dep:libm", "fearless_simd/libm"]
# Allow loading Pixmap from PNG, and drawing png glyphs.
png = ["std", "dep:png"]
# Add helpers for drawing a probe scene.
probe = []
# Enable multi-threaded rendering.
multithreading = ["std"]
# Development only features

# Enable a simple version of SVG drawing.
# This is only intended for development of Vello CPU itself,
# and is likely to be removed/moved.
pico_svg = ["dep:roxmltree"]

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(disable_dispatch_sse4_2)", "cfg(disable_dispatch_avx2)", "cfg(disable_dispatch_avx512)"] }

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "allow"
negative_feature_names = "warn"
redundant_feature_names = "allow"
wildcard_dependencies = "warn"
incompatible_msrv = "allow"
