[package]
name = "vello_example_scenes"
description = "Vello Example Scenes."
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"
publish = false

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(disable_dispatch_sse4_2)", "cfg(disable_dispatch_avx2)", "cfg(disable_dispatch_avx512)"]

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "allow"
wildcard_dependencies = "warn"

[features]
default = []
cpu = ["dep:vello_cpu"]
webgl_gpu_timing = [
    "web-sys/ExtDisjointTimerQuery",
    "web-sys/HtmlCanvasElement",
    "web-sys/WebGl2RenderingContext",
    "web-sys/WebGlQuery",
]

[dependencies]
bytemuck = { workspace = true, features = [] }
smallvec = { workspace = true }
glifo = { workspace = true }
skrifa = { version = "0.49.0", default-features = false, features = ["autohint_shaping"] }
vello_gpu = { workspace = true, default-features = false, features = [
    "text",
    "all_shader_features",
] }
vello_common = { workspace = true, features = ["pico_svg", "png"] }
image = { workspace = true, features = ["jpeg"] }
vello_cpu = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
parley = { version = "0.11.0", default-features = false, features = ["std"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "AddEventListenerOptions",
    "Window",
    "Performance",
    "Document",
    "Node",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "Touch",
    "TouchEvent",
    "TouchList",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = { version = "0.11.0", default-features = true }
