[package]
name = "vello_tests"
description = "The test suite for vello_cpu and vello_gpu"
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"
publish = false
autotests = false

[[test]]
name = "tests"
path = "tests/mod.rs"

[[bin]]
name = "regenerate_probe_reference"
path = "src/regenerate_probe_reference.rs"
required-features = ["force_support_fallback"]

[dependencies]
glifo = { workspace = true }
vello_common = { workspace = true, features = ["std", "probe"] }
vello_cpu = { workspace = true, features = ["multithreading", "std", "f32_pipeline"] }
vello_gpu = { workspace = true, features = [
    "text",
    "wgpu",
    "wgpu_default",
    "all_shader_features",
    "probe",
] }
fearless_simd = { workspace = true }
wgpu = { workspace = true, default-features = true }
pollster = { workspace = true }
vello_dev_macros = { workspace = true }
vello_test_support = { workspace = true }
bytemuck = { workspace = true }
skrifa = { version = "0.49.0", default-features = false, features = ["autohint_shaping"] }
smallvec = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxipng = { workspace = true, features = ["freestanding", "parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "Response",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "WebGlTexture",
] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# Provides the JavaScript module that compiles WebGL shaders before the WASM binary loads.
vello_gpu_shaders = { workspace = true, features = ["glsl"] }
# Required for introspecting the built WASM binary.
wasmparser = "0.235.0"

[features]
default = ["force_support_fallback"]
force_support_fallback = ["fearless_simd/force_support_fallback"]
webgl = ["vello_gpu/webgl", "vello_gpu/probe"]

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(disable_dispatch_sse4_2)", "cfg(disable_dispatch_avx2)", "cfg(disable_dispatch_avx512)"]

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "allow"
wildcard_dependencies = "warn"
