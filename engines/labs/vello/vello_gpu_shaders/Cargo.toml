[package]
name = "vello_gpu_shaders"
# When updating, also update the version in the workspace dependency in the root Cargo.toml
version = "0.4.0"
description = "Provide WESL shaders linked to WGSL and GLSL for the `vello_gpu` backends."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"

[package.metadata.docs.rs]
all-features = true
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]
naga = { workspace = true, features = ["wgsl-in", "wgsl-out", "glsl-out"], optional = true }

[build-dependencies]
naga = { workspace = true, features = ["wgsl-in", "wgsl-out", "glsl-out"] }
# Pinned exactly: the 0.4.1 releases of wesl and its wgsl-* crates require rustc 1.96,
# newer than our toolchain. The wgsl-*/wesl-macros pins force wesl's own `^0.4`
# transitive requirements to resolve to 0.4.0 as well.
wesl = "=0.4.0"
wesl-macros = "=0.4.0"
wgsl-parse = "=0.4.0"
wgsl-types = "=0.4.0"

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in", "wgsl-out", "glsl-out"] }
wesl = "=0.4.0"

[features]
default = ["blurred_rounded_rect", "full_image_support", "gradient_sweep", "wgpu_external_texture"]
blurred_rounded_rect = []
full_image_support = []
gradient_sweep = []
wgpu_external_texture = []
glsl = ["dep:naga"]
unminified = []

[[bin]]
name = "vello_gpu_shaders"
path = "src/main.rs"
test = false

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(disable_dispatch_sse4_2)", "cfg(disable_dispatch_avx2)", "cfg(disable_dispatch_avx512)"]

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "allow"
wildcard_dependencies = "warn"
