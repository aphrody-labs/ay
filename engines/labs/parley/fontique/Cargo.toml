[package]
autoexamples = false
name = "fontique"
version = "0.13.0"
description = "Font enumeration and fallback."
keywords = ["font", "text"]
categories = ["gui", "os", "no-std"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/parley"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["system"]
# Get floating point functions from the standard library
# (likely using your target's libc).
std = ["read-fonts/std", "dep:memmap2", "parlance/std"]
# Use floating point implementations from libm.
# This is useful for `no_std` environments.
# However, note that the `libm` crate is not as efficient as the standard library.
libm = ["read-fonts/libm"]
# Forwarded to `parlance`, which then implements traits from `bytemuck` on its types.
bytemuck = ["parlance/bytemuck"]
# Enable support for system font backends.
# This also enables `std`.
system = [
    "std",
    "dep:windows",
    "dep:windows-core",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-core-text",
    "dep:objc2-foundation",
    "dep:yeslogic-fontconfig-sys",
    "dep:roxmltree",
]

# Use dlopen to load the fontconfig library. This allows Fontique to compile even if the
# system does not have fontconfig installed, although the font fallback to system fonts
# will not work properly in this case (no such fallback will occur)
fontconfig-dlopen = ["yeslogic-fontconfig-sys?/dlopen"]

[dependencies]
read-fonts = { workspace = true }
linebender_resource_handle = { workspace = true }
smallvec = "1.16.6"
memmap2 = { version = "0.9.12", optional = true }
hashbrown = { workspace = true }
parlance = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite"], optional = true }
windows-core = { version = "0.62.2", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# FIX: Enable relax-sign-encoding to prevent the bug described in this issue: https://github.com/madsmtm/objc2/issues/566
objc2 = { version = "0.6.5", optional = true, features = ["std", "relax-sign-encoding"] }
# NOTE: When updating objc2-foundation, objc2-core-foundation, or objc2-core-text make sure to use the version of objc2
# that they reference to prevent crate duplication.
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "alloc",
    "NSArray",
    "NSEnumerator",
    "NSPathUtilities",
    "NSString",
] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "CFBase",
    "CFURL",
] }
objc2-core-text = { version = "0.3.2", optional = true, default-features = false, features = [
    "CTFont",
    "CTFontDescriptor",
    "CTFontCollection",
] }

# OpenHarmony reports `target_os = "linux"` but ships no Fontconfig library.
[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
yeslogic-fontconfig-sys = { version = "6.0.1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
roxmltree = { version = "0.21.2", optional = true }

[lints.rust]
unsafe_code = "deny"
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "allow"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
incompatible_msrv = "allow"
