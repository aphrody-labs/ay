[package]
name = "parley"
version = "0.13.0"
description = "Parley provides an API for implementing rich text layout."
keywords = ["text", "layout"]
categories = ["gui", "graphics", "no-std"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/parley"
exclude = ["/tests"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["system"]
# Get floating point functions from the standard library
# (likely using your target's libc).
std = ["fontique/std", "parley_engine/std", "peniko/std", "skrifa/std", "parlance/std"]
# Use floating point implementations from libm.
# This is useful for `no_std` environments.
# However, note that the `libm` crate is not as efficient as the standard library.
libm = ["fontique/libm", "parley_engine/libm", "peniko/libm", "skrifa/libm", "dep:core_maths"]
# Forwarded to `parlance`, which then implements traits from `bytemuck` on its types.
bytemuck = ["fontique/bytemuck", "parlance/bytemuck", "parley_engine/bytemuck"]
# Enable support for system font backends.
# This also enables `std`.
system = ["std", "fontique/system"]
# Enable dictionary-based line and word breaking for complex scripts (CJK, Thai, Khmer, Lao, Myanmar).
# When disabled, a lightweight segmenter is used that falls back to character-level breaks for those scripts.
complex-scripts = ["parley_engine/complex-scripts"]

[dependencies]
smallvec = { workspace = true }
linebender_resource_handle = { workspace = true }
fontique = { workspace = true }
parlance = { workspace = true }
parley_engine = { workspace = true }
skrifa = { workspace = true }
thin-vec = { workspace = true }
core_maths = { version = "0.1.1", optional = true }
hashbrown = { workspace = true }

[dev-dependencies]
parlance = { workspace = true, features = ["bytemuck"] }
parley_dev = { workspace = true }
peniko = { workspace = true }

bytemuck = { workspace = true }
icu_properties = { workspace = true, features = ["compiled_data"] }
icu_segmenter = { workspace = true, features = ["compiled_data"] }

# We special-case android targets because oxipng doesn't build in Android CI.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
oxipng = { version = "9.1.5", default-features = false, features = ["freestanding"] }

[lints.rust]
unsafe_code = "deny"
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "allow"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
incompatible_msrv = "allow"
