[workspace]
resolver = "3"
members = [
    "crates/ay",
    "crates/ay_bridge",
    "crates/ay_cli",
    "crates/ay_core",
    "crates/ay_depot",
    "crates/ay_net",
    "crates/bun_hpack",
    "crates/bun_wyhash",
    "crates/gpui_util",
    "crates/rope",
    "crates/sum_tree",
    "crates/ztracing",
    "crates/ztracing_macro",
]

[workspace.package]
version = "2026.11.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/ay"

[workspace.dependencies]
# First-party zero-WebKit runtime crates (0 vendor/, 0 third_party/, 0 UI bloat)
ay_bridge = { path = "crates/ay_bridge" }
ay_net = { path = "crates/ay_net" }
ay_depot = { path = "crates/ay_depot" }
aphrody-core = { path = "crates/ay_core" }
bun_hpack = { path = "crates/bun_hpack" }
bun_wyhash = { path = "crates/bun_wyhash" }
gpui_util = { path = "crates/gpui_util" }
rope = { path = "crates/rope" }
sum_tree = { path = "crates/sum_tree" }
ztracing = { path = "crates/ztracing" }
ztracing_macro = { path = "crates/ztracing_macro" }

# Late-2026 crates.io dependencies (lean zero-WebKit runtime stack)
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "matched-path"] }
clap = { version = "4.6.9", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4.6"
heapless = "0.9"
http = "1.3"
log = "0.4.34"
lol_html = "3.0.3"
pingora-ketama = "0.9.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tinyufo = { package = "TinyUFO", version = "0.9.1" }
tokio = "1.54.1"
tracing = "0.1.44"
unicode-segmentation = "1.12"
which = "8.0"
zerocopy = { version = "0.8.66", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
redundant_imports = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
clone_on_ref_ptr = "deny"
trivially_copy_pass_by_ref = "deny"
inefficient_to_string = "deny"
manual_string_new = "deny"
large_types_passed_by_value = "deny"
manual_memcpy = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
overflow-checks = false
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"

[profile.compact]
inherits = "dist"
opt-level = "z"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"
