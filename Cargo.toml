[workspace.lints.rust]
unsafe_code = "forbid"
redundant_imports = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
clone_on_ref_ptr = "deny"
trivially_copy_pass_by_ref = "deny"
inefficient_to_string = "deny"
manual_string_new = "deny"
large_types_passed_by_value = "deny"
manual_memcpy = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
overflow-checks = false
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"

[profile.compact]
inherits = "dist"
opt-level = "z"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"

