[workspace]
resolver = "3"
members = [
    "crates/ay",
    "crates/ay_cli",
    "crates/ay_core",
    "crates/ay_craft",
    "crates/ay_design",
    "crates/ay_macros",
    "crates/ay_net",
    "crates/ay_ui",
    "crates/blitz_traits",
    "crates/bun_hpack",
    "crates/bun_wyhash",
    "crates/gpui_util",
    "crates/rope",
    "crates/sum_tree",
    "crates/ztracing",
    "crates/ztracing_macro",
]
exclude = [
    "engines/labs",
    "engines/bun",
]

[workspace.package]
version = "2026.11.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/ay"

[workspace.dependencies]
# First-party fused crates (0 vendor/, 0 third_party/)
ay_macros = { path = "crates/ay_macros" }
ay_net = { path = "crates/ay_net" }
ay_ui = { path = "crates/ay_ui" }
aphrody-core = { path = "crates/ay_core" }
aphrody-craft = { path = "crates/ay_craft" }
blitz-traits = { path = "crates/blitz_traits" }
bun_hpack = { path = "crates/bun_hpack" }
bun_wyhash = { path = "crates/bun_wyhash" }
design-engine = { path = "crates/ay_design" }
gpui_util = { path = "crates/gpui_util" }
rope = { path = "crates/rope" }
sum_tree = { path = "crates/sum_tree" }
ztracing = { path = "crates/ztracing" }
ztracing_macro = { path = "crates/ztracing_macro" }

# Late-2026 crates.io dependencies (Cloudflare & web stack strictly via crates.io)
anyhow = "1.0.104"
atomic_refcell = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "matched-path"] }
bitflags = "2.9"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4.6"
cursor-icon = "1.1"
heapless = "0.9"
http = "1.3"
keyboard-types = "0.8"
log = "0.4.34"
lol_html = "3.0.3"
pingora-ketama = "0.9.1"
qrcode = "0.15.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol_str = "0.3"
thiserror = "2.0.21"
tinyufo = { package = "TinyUFO", version = "0.9.1" }
tokio = "1.54.1"
tracing = "0.1.44"
unicode-segmentation = "1.12"
url = "2.5.8"
which = "8.0"
zerocopy = { version = "0.8.66", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
redundant_imports = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
clone_on_ref_ptr = "deny"
inefficient_to_string = "deny"
manual_string_new = "deny"
large_types_passed_by_value = "deny"
manual_memcpy = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.compact]
inherits = "release"
opt-level = "z"
lto = "thin"
panic = "abort"
strip = "symbols"
