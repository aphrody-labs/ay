[package]
name = "blitz-tests"
description = "Integration tests for Blitz"
publish = false
version = "2026.11.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/aphrody-labs/aphrody"

edition = "2024"
autotests = false
rust-version = "1.100"
[dev-dependencies]
# Blitz dependencies
blitz-test-harness = { path = "../../../crates/browser/blitz_test_harness" }
blitz-dom = { path = "../../../crates/browser/blitz_dom", features = ["accessibility", "autofocus", "floats", "system-fonts", "text-transform-icu"] }
blitz-html = { path = "../../../crates/browser/blitz_html" }
blitz-traits = { path = "../../../crates/browser/blitz_traits" }
blitz-paint = { path = "../../../crates/browser/blitz_paint", features = ["scrollbars", "svg"] }
dioxus-native-dom = { path = "../../../crates/dioxus/dioxus_native_dom" }
anyrender = { path = "../../../crates/gpu/anyrender" }
anyrender_vello_cpu = { path = "../../../crates/gpu/anyrender_vello_cpu" }

# DioxusLabs dependencies
dioxus = { path = "../../../crates/dioxus/dioxus" }
dioxus-core = { path = "../../../crates/dioxus/dioxus_core" }

# Other dependencies
style = { package = "stylo", version = "0.24.0" }
accesskit = { features = ["enumn"], git = "https://github.com/aphrody-labs/accesskit.git", tag = "v0.25.2-aphrody.20261120" }
markup5ever = "0.40.0"
cursor-icon = "1"
keyboard-types = { version = "0.8", default-features = false }
taffy = { path = "../../../crates/gpu/taffy" }
test-that = "0.6.0"
usvg = { version = "0.46.0", default-features = false }

[lib]
path = "lib.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[workspace]
