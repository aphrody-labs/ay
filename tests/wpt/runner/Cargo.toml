[package]
name = "wpt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100"
publish = false

[features]
default = ["cpu", "tiny-skia", "skia"]
gpu = ["dep:anyrender_vello"]
cpu = ["dep:anyrender_vello_cpu"]
tiny-skia = ["dep:anyrender_tiny_skia"]
skia = ["dep:anyrender_skia"]

[dependencies]
mimalloc = "0.1.48"
blitz-dom = { path = "../../../crates/browser/blitz_dom", features = ["svg", "floats", "system-fonts", "woff", "complex-scripts", "text-transform-icu", "writing-mode"] }
blitz-html = { path = "../../../crates/browser/blitz_html" }
blitz-vibey-script = { path = "../../../crates/browser/blitz_vibey_script" }
blitz-traits = { path = "../../../crates/browser/blitz_traits" }
blitz-paint = { path = "../../../crates/browser/blitz_paint", features = ["default"] }
anyrender = { path = "../../../crates/gpu/anyrender" }
anyrender_vello = { version = "0.15.0", optional = true }
anyrender_vello_cpu = { path = "../../../crates/gpu/anyrender_vello_cpu", optional = true }
anyrender_tiny_skia = { version = "0.1.0", optional = true }
anyrender_skia = { version = "0.12.0", optional = true }

taffy = { path = "../../../crates/gpu/taffy" }
style = { package = "stylo", version = "0.24.0" }
style_traits = { package = "stylo_traits", version = "0.24.0" }
markup5ever = "0.40.0"
parley = { version = "0.13", default-features = false, features = ["std"] }
peniko = { version = "0.6.1", default-features = false }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
url = { version = "2.5.9", features = ["serde"] }
data-url = "0.3"
png = "0.17"
glob = "0.3.1"
html-escape = "0.2.13"
dify = { version = "0.7.4", default-features = false }
env_logger = "0.11.5"
owo-colors = "4.1.0"
log = "0.4.22"
regex = "1.13.2"
rayon = "1.12.0"
thread_local = "1.1.4"
bitflags = "2.6.0"
pollster = "0.4.0"
atomic_float = "1"
supports-hyperlinks = "3.1.0"
terminal-link = "0.1.0"
wptreport = { version = "0.0.5", default-features = false }
wpt_manifest = "0.2.1"
os_info = "3.10.0"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"

[workspace]
