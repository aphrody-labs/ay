[package]
name = "design-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Pure-Rust design engine consolidating FigCraft IR, Kotlin-derived Material 3 JSON tokens (Taffy/WGPU/Rust/TS/TSX/RSX/GPUI/Dioxus/React/Iced/Bevy/Egui), Vice City Sunset / COSMIC / Omarchy presets, Impeccable + UI/UX WCAG auditor/optimizer, and code/recon/index/sitemap/media/desktop/browser synthesis"

[lib]
name = "design_engine"
path = "src/lib.rs"

[features]
default = ["png-ingest"]
png-ingest = ["dep:png"]

[dependencies]
png = { version = "0.18", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zerocopy = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_methods = "allow"
