[package]
name = "ztracing"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"

[lib]
doctest = false

[features]
web = []

[dependencies]
tracing = { workspace = true }
ztracing_macro = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(ztracing)', 'cfg(ztracing_with_memory)'] }
warnings = "allow"

[lints.clippy]
all = "allow"
