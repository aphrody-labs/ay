name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: aphrody-labs/.github/.github/workflows/reusable-rust-ci.yml@main
    with:
      toolchain: "nightly-2026-11-14"
      run_cargo_deny: true
      test_args: "-p ay -p ay_bridge -p ay_cli -p ay_depot -p ay_net -p aphrody-core -p bun_wyhash -p bun_hpack"
      clippy_args: "-p ay -p ay_bridge -p ay_cli -p ay_depot -p ay_net -p aphrody-core -p bun_wyhash -p bun_hpack --all-targets"

  hygiene:
    uses: aphrody-labs/.github/.github/workflows/reusable-hygiene-ci.yml@main
    with:
      repo_name: "ay"
      run_gitleaks: true
