name: Repo Automation

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  automate:
    uses: aphrody-labs/aphrody-kit/.github/workflows/reusable-repo-automation.yml@main
    with:
      has_rust: true
      has_bun: false
      audit_cmd: "cargo metadata --no-deps --format-version 1 >/dev/null"
    secrets: inherit
